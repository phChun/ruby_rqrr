name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-data:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - id: fetch
        uses: oxidize-rb/actions/fetch-ci-data@v1
        with:
          stable-ruby-versions: |
            exclude: []
  ci:
    runs-on: ${{ matrix.os }}
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        ruby: ${{ fromJSON(needs.ci-data.outputs.result).stable-ruby-versions }}
        # include:
        # mswin relies on head and we're not creating releases for it
        # so disabling it as well.
        # - os: windows-latest
        #   ruby: mswin
    steps:
      - uses: actions/checkout@v4

      - name: Remove Gemfile.lock
        run: rm Gemfile.lock

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
          cache-version: v5

      - name: Compile rust ext
        run: bundle exec rake compile:release

      - name: Run ruby tests
        run: bundle exec rake test

      - name: Lint ruby
        run: bundle exec rake standard

      - name: Lint rust
        run: cargo clippy -- -D warnings && cargo fmt --check
